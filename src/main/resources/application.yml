spring:
  application:
    name: adventure-ai-agent
  ai:
    zhipuai:
      api-key: ${ZHIPUAI_API_KEY}
      chat:
        options:
          model: ${ZHIPUAI_MODEL}
    dashscope:
      api-key: ${DASH_SCOPE_API_KEY}
      chat:
        options:
          model: qwen-plus
  profiles:
    active: local
server:
  port: 8392
  servlet:
    context-path: /api

# springdoc-openapi????
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'api'
      paths-to-match: '/**'
      packages-to-scan: com.adventure.adventureaiagent.controller
knife4j:
  enable: true
  setting:
    language: zh_cn

cos:
  client:
    bucket: "${cos.client.bucket}"
    host: "${cos.client.host}"
    region: "${cos.client.region}"
    secret-id: "${cos.client.secret-id}"
    secret-key: "${cos.client.secret-key}"